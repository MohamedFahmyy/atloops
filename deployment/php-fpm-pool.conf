; ==============================================================================
; AT LOOPS ENTERPRISE — DEDICATED PHP-FPM POOL FOR MULTI-SITE SERVER
; File location: /etc/php/8.4/fpm/pool.d/atloops.conf
; (Replace 8.4 with your server's installed PHP version: 8.2, 8.3, or 8.4)
; ==============================================================================

[atloops]
user = www-data
group = www-data

listen = /var/run/php/php8.4-fpm-atloops.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic Process Management (isolated from other websites)
pm = dynamic
pm.max_children = 25
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; Memory & Execution Limits
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 48M
php_admin_value[max_execution_time] = 60

; Security Hardening
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
