# ==============================================================================
# AT LOOPS ENTERPRISE — NGINX PRODUCTION CONFIGURATION
# Dual Architecture: React SPA Frontend + Laravel 12/13 API Backend
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name atloops.com www.atloops.com;
    return 301 https://atloops.com$request_uri;
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atloops.com;

    # SSL Certificate Configuration (Certbot / Let's Encrypt or Custom Enterprise CA)
    ssl_certificate /etc/letsencrypt/live/atloops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atloops.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:;" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upload file size limit
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # 1. FRONTEND: React SPA Production Build (Vite Dist)
    # --------------------------------------------------------------------------
    root /var/www/atloops-enterprise/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. BACKEND API: Laravel REST API Router
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        root /var/www/atloops-enterprise/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        # Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/atloops-enterprise/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    # Stricter Rate Limiting for Login / Auth
    location ^~ /api/v1/auth/ {
        root /var/www/atloops-enterprise/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        limit_req zone=auth_limit burst=5 nodelay;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/atloops-enterprise/backend/public/index.php;
        }
    }

    # --------------------------------------------------------------------------
    # 3. PUBLIC UPLOADS / MEDIA ASSETS (Storage Link)
    # --------------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/atloops-enterprise/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Prevent access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
