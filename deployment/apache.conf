# ==============================================================================
# AT LOOPS ENTERPRISE — APACHE 2.4 PRODUCTION CONFIGURATION
# VirtualHost with mod_proxy_fcgi for PHP 8.4-FPM & React SPA Fallback
# ==============================================================================

<VirtualHost *:80>
    ServerName atloops.com
    ServerAlias www.atloops.com
    Redirect permanent / https://atloops.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName atloops.com
    ServerAlias www.atloops.com
    DocumentRoot "/var/www/atloops-enterprise/frontend/dist"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/atloops.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/atloops.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # 1. API Reverse Proxy to Laravel Backend Public Directory
    Alias /api "/var/www/atloops-enterprise/backend/public"
    <Directory "/var/www/atloops-enterprise/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php8.4-fpm.sock|fcgi://localhost/"
        </FilesMatch>

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # 2. Storage Directory for Public Media
    Alias /storage "/var/www/atloops-enterprise/backend/storage/app/public"
    <Directory "/var/www/atloops-enterprise/backend/storage/app/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 3. Frontend React SPA Directory
    <Directory "/var/www/atloops-enterprise/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Exclude /api and /storage from SPA fallback
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/storage
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "^\.(env|git|htaccess)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/atloops_enterprise_error.log
    CustomLog ${APACHE_LOG_DIR}/atloops_enterprise_access.log combined
</VirtualHost>
