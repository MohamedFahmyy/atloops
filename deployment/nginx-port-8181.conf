# ==============================================================================
# AT LOOPS ENTERPRISE — NGINX VIRTUAL HOST FOR PORT 8181
# Runs completely isolated on port 8181 (leaving port 80, 8080, 443 untouched)
# 
# Installation on Linux Server:
# 1. cp deployment/nginx-port-8181.conf /etc/nginx/sites-available/atloops-8181
# 2. ln -sf /etc/nginx/sites-available/atloops-8181 /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. sudo ufw allow 8181/tcp
# ==============================================================================

server {
    listen 8181;
    listen [::]:8181;

    # Accepts requests via server IP or domain on port 8181
    server_name _ atloops.com www.atloops.com;

    # Max upload limit for media assets (images, PDFs, documents)
    client_max_body_size 64M;

    # High performance compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. FRONTEND: React SPA Production Build (Vite Dist)
    # --------------------------------------------------------------------------
    root /var/www/atloops.com/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-Term Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. BACKEND API: Laravel REST API Router
    # --------------------------------------------------------------------------
    location /api {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        # FastCGI socket - matches active PHP version (check: ls /var/run/php/)
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        # Fallback if generic socket exists:
        # fastcgi_pass unix:/var/run/php/php-fpm.sock;

        fastcgi_param SCRIPT_FILENAME /var/www/atloops.com/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/atloops.com/backend/public;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --------------------------------------------------------------------------
    # 3. PUBLIC UPLOADS / MEDIA STORAGE
    # --------------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/atloops.com/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Prevent access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/atloops_8181_access.log;
    error_log /var/log/nginx/atloops_8181_error.log;
}
