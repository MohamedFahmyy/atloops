# ==============================================================================
# AT LOOPS ENTERPRISE — NGINX VIRTUAL HOST FOR MULTI-SITE SERVER
# File location on server: /etc/nginx/sites-available/atloops.com
# Symlink: ln -s /etc/nginx/sites-available/atloops.com /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP -> HTTPS Redirect (Strictly scoped to atloops.com)
server {
    listen 80;
    listen [::]:80;
    server_name atloops.com www.atloops.com;

    # Allow Let's Encrypt ACME challenge without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/atloops.com/frontend/dist;
        allow all;
    }

    location / {
        return 301 https://atloops.com$request_uri;
    }
}

# 2. Main HTTPS Server Block for atloops.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atloops.com www.atloops.com;

    # SSL Certificate Configuration (Certbot will manage these lines)
    ssl_certificate /etc/letsencrypt/live/atloops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atloops.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ATLOOPS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Redirect www to non-www
    if ($host = www.atloops.com) {
        return 301 https://atloops.com$request_uri;
    }

    # Security Headers (Scoped to atloops.com)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Max upload limit for media assets
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # 2.1 FRONTEND: React SPA (Production Vite Dist)
    # --------------------------------------------------------------------------
    root /var/www/atloops.com/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2.2 BACKEND API: Laravel REST API Router
    # --------------------------------------------------------------------------
    location /api {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Or custom pool socket
        fastcgi_param SCRIPT_FILENAME /var/www/atloops.com/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/atloops.com/backend/public;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Stricter Rate Limiting for Auth & Inquiries
    location ^~ /api/v1/auth/ {
        root /var/www/atloops.com/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        limit_req zone=atloops_auth_limit burst=5 nodelay;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/atloops.com/backend/public/index.php;
        }
    }

    # --------------------------------------------------------------------------
    # 2.3 PUBLIC UPLOADS / MEDIA STORAGE
    # --------------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/atloops.com/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Prevent access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
