# ==============================================================================
# AT LOOPS ENTERPRISE — APACHE 2.4 CONFIGURATION FOR PORT 8181
# Safe alongside other websites running on port 80, 8080, etc.
#
# Installation on Linux Server:
# 1. sudo cp deployment/apache-port-8181.conf /etc/apache2/sites-available/atloops-8181.conf
# 2. sudo a2ensite atloops-8181.conf
# 3. sudo apache2ctl configtest && sudo systemctl reload apache2
# 4. sudo ufw allow 8181/tcp
# ==============================================================================

Listen 8181

<VirtualHost *:8181>
    ServerName atloops.com
    ServerAlias *
    DocumentRoot "/var/www/atloops.com/frontend/dist"

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # 1. API Reverse Proxy to Laravel Backend Public Directory
    Alias /api "/var/www/atloops.com/backend/public"
    <Directory "/var/www/atloops.com/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost/"
        </FilesMatch>

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # 2. Storage Directory for Public Media
    Alias /storage "/var/www/atloops.com/backend/storage/app/public"
    <Directory "/var/www/atloops.com/backend/storage/app/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 3. Frontend React SPA Directory
    <Directory "/var/www/atloops.com/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/atloops_8181_error.log
    CustomLog ${APACHE_LOG_DIR}/atloops_8181_access.log combined
</VirtualHost>
