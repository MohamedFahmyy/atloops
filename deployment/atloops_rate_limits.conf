# ==============================================================================
# AT LOOPS ENTERPRISE — NGINX RATE LIMITING (DROP IN /etc/nginx/conf.d/)
# Loaded globally in http {} block without conflicting with other virtual hosts
# ==============================================================================

limit_req_zone $binary_remote_addr zone=atloops_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=atloops_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=atloops_leads_limit:10m rate=15r/m;
